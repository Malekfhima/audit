# Environnement Docker complet : MongoDB + API Express/TypeScript + frontend React
#
#   docker compose up --build
#
#   Frontend : http://localhost:8081
#   API      : http://localhost:4000/api
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      MONGO_URI: mongodb://mongo:27017/audit_gestion
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret-at-least-32-characters}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-change-me-refresh-secret-at-least-32-chars}
      JWT_EXPIRES_IN: 1h
      REFRESH_TOKEN_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:8081
      LOG_LEVEL: info
      DEFAULT_PAGE_SIZE: "10"
      MAX_PAGE_SIZE: "100"
      RATE_LIMIT_MAX: "100"
      RATE_LIMIT_WINDOW: "15"
      BCRYPT_SALT_ROUNDS: "10"
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  mongo_data:
